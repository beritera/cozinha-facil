<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozinha Fácil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Cozinha Fácil</h1>
    <p>Gerencie suas receitas de forma simples.</p>

    <form id="recipe-form">
      <input type="text" id="title" placeholder="Nome da receita" required />
      <textarea id="description" placeholder="Descrição da receita"></textarea>
      <button type="submit">Cadastrar Receita</button>
    </form>

    <section>
      <h2>Receitas cadastradas</h2>
      <div id="recipes-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
